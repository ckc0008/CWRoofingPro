name: Fix Launch Dependencies

on:
  push:
    branches: [chore/launch-security-audit]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/launch-security-audit
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm audit fix --package-lock-only || true
      - name: Commit lockfile fixes
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo 'No dependency changes needed'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          git commit -m 'Update vulnerable production dependencies'
          git push origin HEAD:chore/launch-security-audit
